<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>ANPR | Officer Login</title>
	<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

	<div class="bg-wrapper" style="background-image: url('{{ url_for('static', filename='images/road2.jpg') }}');">
		<div class="bg-overlay"></div>
	</div>

	<div class="auth-container">
		<img src="{{ url_for('static', filename='images/policeMan.png') }}" class="avatar" alt="Officer Avatar">
		<h1>Officer Login</h1>
		<h2>Secure System Access</h2>

		<div class="flash-container">
			{% with messages = get_flashed_messages(with_categories=true) %}
			{% if messages %}
			{% for category, msg in messages %}
			<div class="alert {{ category }}">{{ msg }}</div>
			{% endfor %}
			{% endif %}
			{% endwith %}
		</div>

		<form action="#" method="post">
			<div class="input-group">
				<label for="usrname">Officer ID / Username</label>
				<input type="text" id="usrname" name="usrname" placeholder="Enter username" required autofocus>
			</div>

			<div class="input-group">
				<label for="psw">Password</label>
				<input type="password" id="psw" name="psw" placeholder="Enter password" required>
			</div>

			<button type="submit" class="btn">Authenticate</button>
		</form>
	</div>

</body>

</html>
